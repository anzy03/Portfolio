<svg class="intro-blueprint-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="bpGridSmall" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    <pattern id="bpGridLarge" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#bpGridSmall)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.10" />
    </pattern>
    <pattern id="wallHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.18" />
    </pattern>
    <linearGradient id="bpLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="navmeshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03" />
    </linearGradient>
    <marker id="bpArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8" fill-opacity="0.6" />
    </marker>
    <marker id="bpArrowDim" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#38bdf8" fill-opacity="0.35" />
    </marker>
    <filter id="bpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .bp-scan { animation: bpScan 14s linear infinite; }
      @keyframes bpScan { 0% { transform: translateY(-50px); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateY(650px); opacity: 0; } }
      .bp-dim { stroke: #38bdf8; stroke-opacity: 0.35; stroke-width: 0.8; stroke-dasharray: 4,3; }
      .bp-wall { stroke: #38bdf8; stroke-width: 1.8; stroke-opacity: 0.65; fill: url(#wallHatch); }
      .bp-cover-low { stroke: #38bdf8; stroke-width: 1.2; stroke-opacity: 0.6; fill: rgba(56, 189, 248, 0.08); }
      .bp-cover-high { stroke: #60a5fa; stroke-width: 1.4; stroke-opacity: 0.7; fill: rgba(37, 99, 235, 0.14); }
      .bp-text-title { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: #38bdf8; font-weight: 600; letter-spacing: 1.5px; }
      .bp-text-meta { font-family: "JetBrains Mono", monospace; font-size: 8px; fill: #94a3b8; letter-spacing: 0.8px; }
      .bp-text-tag { font-family: "JetBrains Mono", monospace; font-size: 7.5px; fill: #7dd3fc; }
