<svg class="intro-blueprint-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="cleanGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.03" />
    </pattern>
    <pattern id="cleanGridMajor" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="url(#cleanGrid)" />
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.07" />
    </pattern>
    <style>
      .bp-line { stroke: #38bdf8; stroke-width: 1; stroke-opacity: 0.22; }
      .bp-line-bright { stroke: #38bdf8; stroke-width: 1.2; stroke-opacity: 0.38; }
      .bp-cover { stroke: #38bdf8; stroke-width: 1; stroke-opacity: 0.28; fill: rgba(56, 189, 248, 0.03); }
      .bp-txt { font-family: "JetBrains Mono", monospace; font-size: 8px; fill: #64748b; letter-spacing: 1px; }
      .bp-txt-cyan { font-family: "JetBrains Mono", monospace; font-size: 8px; fill: #38bdf8; letter-spacing: 1px; opacity: 0.6; }
    </style>
  </defs>
  <rect x="520" y="0" width="920" height="650" fill="url(#cleanGridMajor)" />
